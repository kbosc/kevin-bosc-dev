# ============================================================
# CI/CD Pipeline — Landing CV Kevin Bosc
#
# Triggers:
#   - Push on main → lint, typecheck, test, build, deploy
#   - Pull request on main → lint, typecheck, test, build (no deploy)
#
# Jobs:
#   1. quality   → ESLint + TypeScript type-check
#   2. test      → Vitest unit tests
#   3. build     → Vite production build
#   4. deploy    → GitHub Pages (only on push to main)
# ============================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------
  # Job 1 — Code quality (lint + type-check)
  # ----------------------------------------------------------
  quality:
    name: 🔍 Lint & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run typecheck

  # ----------------------------------------------------------
  # Job 2 — Unit tests
  # ----------------------------------------------------------
  test:
    name: 🧪 Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test

  # ----------------------------------------------------------
  # Job 3 — Build
  # ----------------------------------------------------------
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ----------------------------------------------------------
  # Job 4 — Deploy to GitHub Pages (only on push to main)
  # ----------------------------------------------------------
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

